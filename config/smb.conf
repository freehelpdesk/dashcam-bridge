[global]
   workgroup = WORKGROUP
   server string = dashcam-bridge
   server role = standalone server
   security = user
   map to guest = never
   usershare allow guests = no
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   smb ports = 445
   server min protocol = SMB2
   client min protocol = SMB2
   # The USB host writes the disk underneath Samba. Leases would keep a
   # computer showing the old folder listing after those writes land.
   smb2 leases = no
   oplocks = no
   level2 oplocks = no
   kernel oplocks = no
   # exFAT has no extended attributes. AppleDouble files are how a Mac
   # stores the extra data, so fruit must not require xattrs.
   vfs objects = fruit
   fruit:metadata = netatalk
   fruit:resource = file
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   ea support = no
   nt acl support = no
   store dos attributes = no
   obey pam restrictions = yes
   unix password sync = no
   pam password change = no
   map archive = no
   wide links = no
   unix extensions = no
   logging = syslog@1
   max log size = 1000
   # Overlapped reads so several clips are pulled at once, not one after another.
   aio read size = 1
   aio write size = 1
   use sendfile = yes
   smb2 max read = 8388608
   smb2 max write = 8388608
   smb2 max trans = 8388608
   socket options = TCP_NODELAY IPTOS_THROUGHPUT

[dashcam]
   comment = Original dashcam files
   path = /mnt/dashcam
   browseable = yes
   read only = __SHARE_READ_ONLY__
   create mask = 0644
   directory mask = 0755
   guest ok = no
   valid users = __SMB_USER__
   force user = root
   map readonly = no
   veto files = /.DS_Store/
   root preexec = /usr/local/lib/dashcam-bridge/assert-mounted.sh
   # Without this, Samba ignores the script's exit status, and a write lands
   # on the boot disk under the empty mount point.
   root preexec close = yes

# With SHARE=snapshot, files dropped here wait until it is safe to write them
# to the drive, at the same path. A file disappears once it is on the drive.
[dashcam-inbox]
   comment = Files waiting to be written to the dashcam drive
   path = /mnt/dashcam-inbox
   available = __INBOX_AVAILABLE__
   browseable = yes
   read only = no
   create mask = 0644
   directory mask = 0755
   guest ok = no
   valid users = __SMB_USER__
   force user = root
   map readonly = no
   veto files = /.DS_Store/lost+found/
   root preexec = /usr/local/lib/dashcam-bridge/assert-mounted.sh /mnt/dashcam-inbox
   root preexec close = yes
