[global]
   workgroup = WORKGROUP
   server string = dashcam-bridge
   server role = standalone server
   security = user
   map to guest = never
   usershare allow guests = no
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   smb ports = 445
   server min protocol = SMB2
   client min protocol = SMB2
   # The USB host writes the disk underneath Samba. Leases would keep a
   # computer showing the old folder listing after those writes land.
   smb2 leases = no
   oplocks = no
   level2 oplocks = no
   kernel oplocks = no
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   ea support = yes
   obey pam restrictions = yes
   unix password sync = no
   pam password change = no
   map archive = no
   wide links = no
   unix extensions = no
   logging = syslog@1
   max log size = 1000

[dashcam]
   comment = Original dashcam files
   path = /mnt/dashcam
   browseable = yes
   read only = yes
   guest ok = no
   valid users = __SMB_USER__
   force user = root
   veto files = /.DS_Store/._*/
   root preexec = /usr/local/lib/dashcam-bridge/assert-mounted.sh
